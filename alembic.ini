[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Реальный URL берётся из settings.py (переменная DATABASE_URL / .env),
# здесь — только плейсхолдер для offline-режима.
sqlalchemy.url = postgresql+asyncpg://user:password@127.0.0.1:5432/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S