<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFEDUCASTLING — AI Chess Platform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="top-bar">
        <img src="logo_sfedu_white.png" alt="ЮФУ" class="sfedu-logo">
        <div class="title-block">
            <div class="title"><img src="knight-s.svg" alt="S" class="t-knight-img"><span class="t-sfedu">FEDU</span><span class="t-castling">CASTLING</span></div>
            <div class="subtitle"><span class="ai-dot"></span> Powered by GigaChat</div>
        </div>
        <span class="version-tag"><span class="crown">♛</span> AI CHESS PLATFORM</span>
    </div>

    <div class="main-area">
        <div class="board-section">
            <div class="board-wrapper">
                <div class="player-bar">
                    <div class="rating-label">Противник (Maia2): <span id="elo-display">1500</span> ELO</div>
                    <input type="range" id="elo-slider" min="1100" max="1900" step="100" value="1500"
                        style="width:100px;accent-color:#225A73;cursor:pointer;">
                    <div id="material-display-top" class="material-display equal"></div>
                </div>

                <div class="board-outer">
                    <div class="coords-rank">
                        <span>8</span><span>7</span><span>6</span><span>5</span>
                        <span>4</span><span>3</span><span>2</span><span>1</span>
                    </div>
                    <div id="board"></div>
                    <div class="coords-file">
                        <span>a</span><span>b</span><span>c</span><span>d</span>
                        <span>e</span><span>f</span><span>g</span><span>h</span>
                    </div>
                </div>

                <div class="player-bar">
                    <div class="rating-label">Вы — Белые</div>
                    <div id="material-display-bottom" class="material-display equal"></div>
                </div>
                <div style="display:flex;align-items:center;gap:10px;">
                    <div id="game-status" style="flex:1;">Ваш ход</div>
                    <button id="new-game-btn" style="padding:4px 12px;background:#225A73;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;">Новая игра</button>
                </div>

                <div class="fen-bar">
                    <input type="text" id="fen-input" value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1" placeholder="Вставьте FEN...">
                    <button id="fen-load">Загрузить</button>
                    <button class="fen-file-btn" id="fen-file" title="Загрузить из файла">📂</button>
                    <input type="file" id="fen-file-input" accept=".fen,.txt" style="display:none">
                </div>
            </div>
        </div>

        <div class="middle-section">
            <h3>История ходов</h3>
            <div id="move-list"></div>
        </div>

        <div class="chat-section">
            <div class="chat-header">
                <div class="icon">⚡</div>
                <h2>Анализ GigaChat</h2>
                <span class="badge">AI</span>
            </div>

            <div class="status-bar">
                <span class="dot"></span>
                <span>Maia Chess Engine подключён</span>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="chat-msg">
                    <div class="msg-avatar">⚡</div>
                    <div class="msg-body">
                        Добро пожаловать в SFEDUCASTLING! Сделайте первый ход, и я начну анализ вашей партии.
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Задайте вопрос по позиции...">
                <button id="chat-send">Отправить</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
