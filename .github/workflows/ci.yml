name: CI

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Backend tests, migrations, and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sfeducasling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sfeducasling_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/sfeducasling_test
      JWT_SECRET_KEY: ci-only-not-a-production-secret

    steps:
      - name: Check out source and Maia3 submodule
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Check Python style
        run: ruff check backend/api_gateway/routes/health.py tests/routes/test_health.py

      - name: Apply migrations to a clean PostgreSQL database
        run: python -m alembic upgrade head

      - name: Run backend test suite
        run: pytest

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Assemble deployable source bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tar -czf "$RUNNER_TEMP/gigachess-${GITHUB_SHA}.tar.gz" \
            --exclude=.git --exclude=.venv --exclude=venv \
            --exclude=frontend/node_modules --exclude=.env \
            --exclude='*.db' --exclude='*.db-*' \
            --exclude=outputs --exclude=dataset --exclude=old_data \
            .

      - name: Upload commit-pinned bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sfeducasling-${{ github.sha }}
          path: ${{ runner.temp }}/gigachess-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
